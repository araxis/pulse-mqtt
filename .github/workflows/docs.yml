name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deploy at a time; let an in-flight publish finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs

      - name: Build the site
        run: npm run docs:build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # Deploys on every push to main and on manual dispatch, never from pull requests (a fork PR
  # must not publish the site). Requires Pages enabled with "GitHub Actions" as the source.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # GitHub's Pages backend intermittently returns a terminal "Deployment failed, try again
      # later" — it has failed most recent runs and always succeeds on a manual re-run. One
      # automatic retry (the official action only, no third-party dependency) turns that routine
      # re-run into a no-op; both attempts publish the same already-built artifact.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before retrying a failed Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
