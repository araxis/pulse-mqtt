name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref (e.g. rapid PR pushes) to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # System.Net.Quic needs the msquic native library; without it the QUIC transport tests
      # would be skipped instead of run.
      - name: Install msquic
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Build
        run: dotnet build -c Release

      - name: Test
        # The heavier EMQX/HiveMQ broker-matrix images run in broker-matrix.yml; the long-running
        # soak harness (Category=Soak) is operational and run on demand, not on every push.
        run: dotnet test -c Release --no-build --logger "console;verbosity=minimal" --filter "Category!=BrokerMatrix&Category!=Soak"

      - name: Pack
        run: dotnet pack -c Release --no-build -o packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.nupkg
          retention-days: 7
