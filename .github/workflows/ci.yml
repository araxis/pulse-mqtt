name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref (e.g. rapid PR pushes) to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # System.Net.Quic needs the msquic native library; without it the QUIC transport tests
      # would be skipped instead of run.
      - name: Install msquic
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Build
        run: dotnet build -c Release

      - name: Test
        # The heavier EMQX/HiveMQ broker-matrix images run in broker-matrix.yml; the long-running
        # soak harness (Category=Soak) is operational and run on demand, not on every push.
        run: dotnet test -c Release --no-build --logger "console;verbosity=minimal" --filter "Category!=BrokerMatrix&Category!=Soak"

      - name: Publish the Blazor WASM sample (trim gate)
        # The publish runs the IL trimmer over the whole Pulse stack in a browser app; a new trim
        # warning here means a library change broke trimming for WASM consumers.
        run: dotnet publish samples/Pulse.Mqtt.BlazorWasmSample -c Release --no-restore -o wasm-publish

      - name: Publish the AOT smoke app (native AOT gate)
        # Unlike the WASM trim gate above, this runs the native-AOT ILC compiler and native codegen
        # over the Pulse stack, so an AOT-incompatible construct or a new trim/AOT warning (IL2xxx /
        # IL3xxx) fails the build here. PublishAot comes from the project file; passing it on the
        # command line would apply it to the netstandard2.0 generator and error (NETSDK1207). The grep
        # catches analyzer warnings that are emitted as warnings rather than errors.
        run: |
          set -o pipefail
          sudo apt-get install -y clang zlib1g-dev
          dotnet publish aot/Pulse.Mqtt.AotSmoke -c Release -r linux-x64 2>&1 | tee aot-publish.log
          if grep -qE "warning IL[0-9]{4}" aot-publish.log; then
            echo "::error::Native-AOT/trim warnings (ILxxxx) detected in the AOT smoke publish"
            exit 1
          fi

      - name: Pack
        run: dotnet pack -c Release --no-build -o packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.nupkg
          retention-days: 7
