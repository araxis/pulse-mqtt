name: Release

# A tag push (vX.Y.Z) publishes a stable release with a GitHub release.
# A push to main publishes a prerelease (X.Y.Z-preview.<run>) to NuGet only.
# Both publish through the same trusted-publishing policy (this workflow file).
on:
  push:
    branches: [main]
    tags: ['v*']

# Serialize publishes per ref so two runs never push the same version at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the no-op-release guard diffs the tag against the previous one

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION=${version}" >> "$GITHUB_ENV"
            echo "STABLE=true" >> "$GITHUB_ENV"
            # A version with a prerelease suffix (e.g. 1.0.0-rc.1) is a NuGet prerelease and a
            # GitHub pre-release, not the "latest" stable.
            [[ "$version" == *-* ]] && echo "PRERELEASE=true" >> "$GITHUB_ENV" || echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props | head -1)
            echo "VERSION=${prefix}-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "STABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Guard against a no-op release
        if: env.STABLE == 'true'
        # Every package ships one lockstep version, so a stable tag republishes all of them. Refuse a
        # tag that changes no shipped content since the previous tag — code, dependency versions, or
        # a packed asset (README, icon) — because it would republish byte-identical packages under a
        # new version (as 2.20.0 did). Version bumps and PublicAPI ledger promotions are release
        # bookkeeping, not shipped changes, so they do not count.
        #
        # Directory.Build.props needs its own check rather than a plain name-only diff: it always
        # changes at every release (VersionPrefix is bumped right after each tag), so watching the
        # whole file would make the guard pass unconditionally — the exact failure it exists to catch.
        # Its content is diffed with that one bookkeeping line filtered out, so a real metadata change
        # (PackageIcon, PackageTags, license, ...) still counts but the version bump alone does not.
        # Keep both the path list and the props-file check in sync with whatever gets packed.
        # Put [republish] in the tag message to override.
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "No earlier tag to compare against; allowing the release."
            exit 0
          fi

          if git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -q '\[republish\]'; then
            echo "Tag message opts into a republish; skipping the no-op guard."
            exit 0
          fi

          changed=$(git diff --name-only "$previous" HEAD -- src Directory.Packages.props README.md icon.png \
            | grep -vE 'PublicAPI\.(Shipped|Unshipped)\.txt$' || true)
          build_props_changed=$(git diff "$previous" HEAD -- Directory.Build.props \
            | grep -E '^[+-][^+-]' | grep -v 'VersionPrefix' || true)

          if [ -z "$changed" ] && [ -z "$build_props_changed" ]; then
            echo "::error::No shipped content changed since $previous — this would republish identical packages under $GITHUB_REF_NAME."
            echo "::error::Release only when code, dependency versions, package metadata, or a packed asset changed. Add [republish] to the tag message to override."
            exit 1
          fi

          echo "Shipped content changed since $previous:"
          if [ -n "$changed" ]; then
            echo "$changed"
          fi
          if [ -n "$build_props_changed" ]; then
            echo "Directory.Build.props:"
            echo "$build_props_changed"
          fi

      # System.Net.Quic needs the msquic native library; without it the QUIC transport tests
      # would be skipped instead of run.
      - name: Install msquic
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Build
        run: dotnet build -c Release -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      - name: Test
        # The EMQX/HiveMQ matrix and the long soak already gate on PRs/main; the release run just
        # confirms the packaged build, so it skips the heavy/long categories.
        run: dotnet test -c Release --no-build --logger "console;verbosity=minimal" --filter "Category!=BrokerMatrix&Category!=Soak"

      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version=$VERSION -o packages

      # Trusted publishing: exchange the workflow's OIDC token for a short-lived (1-hour)
      # nuget.org API key. No long-lived secret to store or rotate. Requires a trusted
      # publishing policy on nuget.org for this repository and workflow file, and the
      # NUGET_USER secret set to the nuget.org account/profile name (not an email).
      - name: NuGet login (OIDC, short-lived key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Extract release notes from the changelog
        if: env.STABLE == 'true'
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## " version "($| )" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $VERSION; using the heading only." >&2
            echo "Release $VERSION." > release-notes.md
          fi

          {
            echo
            echo "### Packages on NuGet"
            echo
            for id in \
              Pulse.Mqtt.Core \
              Pulse.Mqtt.Client \
              Pulse.Mqtt.Dataflow \
              Pulse.Mqtt.DependencyInjection \
              Pulse.Mqtt.Endpoints \
              Pulse.Mqtt.Serialization.Json \
              Pulse.Mqtt.Serialization.MessagePack \
              Pulse.Mqtt.Serialization.Protobuf \
              Pulse.Mqtt.Resilience.Polly \
              Pulse.Mqtt.Storage.LiteDB \
              Pulse.Mqtt.Storage.SqlServer \
              Pulse.Mqtt.Storage.Sqlite \
              Pulse.Mqtt.Transport.Quic \
              Pulse.Mqtt.Transport.WebSocket \
              Pulse.Mqtt.Testing \
              Pulse.Mqtt.Analyzers; do
              echo "- [\`$id\`](https://www.nuget.org/packages/$id/$VERSION)"
            done
          } >> release-notes.md

      - name: Create the GitHub release
        if: env.STABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${PRERELEASE:-false}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            packages/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${flags[@]}"
